name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: TourOps
  RESULT_BUNDLE: TestResults.xcresult
  # 90% of the 320 tests executed (320 passed, 0 failed) in the first green run,
  # rounded down. Raise it when tests are added; lower it only when tests are
  # removed on purpose.
  MIN_EXECUTED_TESTS: 288

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i xcode || true
          xcrun simctl list runtimes

      - name: Select an iOS 26 iPhone simulator
        run: |
          set -euo pipefail
          runtime_id=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and (.version | startswith("26.")))] | last | .identifier // empty')
          if [ -z "$runtime_id" ]; then
            echo "::error::No available iOS 26 simulator runtime on this runner. See the runtimes listed in the 'Print toolchain' step."
            exit 1
          fi
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$runtime_id" '.devices[$rt] // [] | map(select(.name | startswith("iPhone"))) | first | .udid // empty')
          if [ -z "$udid" ]; then
            device_type=$(xcrun simctl list devicetypes -j \
              | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier // empty')
            if [ -z "$device_type" ]; then
              echo "::error::Runtime $runtime_id exists but no iPhone device type is available."
              exit 1
            fi
            udid=$(xcrun simctl create "CI iPhone" "$device_type" "$runtime_id")
          fi
          echo "Runtime: $runtime_id"
          echo "Simulator: $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          {
            echo "### Toolchain"
            echo '```'
            xcodebuild -version
            echo "iOS runtime: $runtime_id"
            echo "Simulator UDID: $udid"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The project references Secrets.xcconfig as its base configuration.
      # It is gitignored, so create an empty one for a clean checkout.
      - name: Create empty Secrets.xcconfig
        run: touch Secrets.xcconfig

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TourOps.xcodeproj \
            -scheme "$SCHEME"

      - name: Run unit tests
        run: |
          set -o pipefail
          # Dummy values on the command line override the target's build
          # settings, so CI never uses the real backend configuration.
          xcodebuild test \
            -project TourOps.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:TourOpsTests \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            SUPABASE_URL=https://ci.example.invalid \
            SUPABASE_PUBLISHABLE_KEY=ci-dummy-key 2>&1 | tee xcodebuild.log

      - name: Report xcodebuild failure
        if: failure()
        run: |
          if [ ! -f xcodebuild.log ]; then
            echo "::error::xcodebuild.log was not produced; the failure happened before xcodebuild ran."
            exit 0
          fi
          grep -E 'error:|Test runner crashed|Failed to launch|Unable to boot|Crash' xcodebuild.log \
            | head -20 \
            | sed -e 's/%/%25/g' -e 's/\r//g' \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          {
            echo "### Last 80 lines of xcodebuild.log"
            echo '```'
            tail -n 80 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          banner=$(grep -E '\*\* (BUILD|TEST) (FAILED|SUCCEEDED) \*\*' xcodebuild.log | tail -n 1 || true)
          echo "Final banner: ${banner:-none found}"

      - name: Show Swift Testing summary lines
        if: always()
        run: |
          if [ -f xcodebuild.log ]; then
            grep -E 'Test run with' xcodebuild.log || echo "No 'Test run with' line in xcodebuild.log"
          else
            echo "No xcodebuild.log"
          fi

      - name: Check executed test count
        if: always()
        run: |
          xcresult_total=0
          passed=0
          failed=0
          skipped=0
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > summary.json || echo "xcresulttool failed"
            xcresult_total=$(jq '.totalTestCount // 0' summary.json 2>/dev/null || echo 0)
            passed=$(jq '.passedTests // 0' summary.json 2>/dev/null || echo 0)
            failed=$(jq '.failedTests // 0' summary.json 2>/dev/null || echo 0)
            skipped=$(jq '.skippedTests // 0' summary.json 2>/dev/null || echo 0)
          else
            echo "::warning::No .xcresult bundle was produced."
          fi
          log_total=0
          if [ -f xcodebuild.log ]; then
            log_total=$(grep -E 'Test run with [0-9]+ test' xcodebuild.log \
              | sed -E 's/.*Test run with ([0-9]+) test.*/\1/' | tail -n 1)
            log_total=${log_total:-0}
          fi
          total=$xcresult_total
          source="xcresulttool summary totalTestCount"
          if [ "$log_total" -gt "$total" ]; then
            total=$log_total
            source="'Test run with' line in xcodebuild.log"
          fi
          echo "xcresulttool totalTestCount: $xcresult_total"
          echo "'Test run with' count in log: $log_total"
          echo "Using $total from: $source"
          echo "::notice title=Unit test counts::executed=$total passed=$passed failed=$failed skipped=$skipped xcresult=$xcresult_total log=$log_total"
          {
            echo "### Unit test counts"
            echo "- executed: $total (from $source)"
            echo "- xcresulttool total: $xcresult_total"
            echo "- Swift Testing log count: $log_total"
            echo "- passed: $passed"
            echo "- failed: $failed"
            echo "- skipped: $skipped"
            echo "- minimum required: $MIN_EXECUTED_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -lt "$MIN_EXECUTED_TESTS" ]; then
            echo "::error::Only $total tests executed; expected at least $MIN_EXECUTED_TESTS."
            exit 1
          fi

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: warn

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
